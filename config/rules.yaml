# Triage Rules Configuration
# Rule chains for Devon's Gmail inbox
version: 2
label_prefix: "Cortex"

# Intent definitions for LLM-based matching
# These can override built-in intents or define new ones
intents:
  archive_request:
    prompt: |
      This is a self-sent email subject. Does the word "archive" or similar
      words like "save", "bookmark", or "keep" appear in it, suggesting the
      sender wants to save something?
      Subject: "{subject}"
      Answer only: yes or no
    model: "gemma3n:e4b"

  todo_request:
    prompt: |
      This is a self-sent email subject. Does it suggest a task, reminder,
      todo item, or something to do later? Look for words like "todo", "task",
      "reminder", "need to", "don't forget", etc.
      Subject: "{subject}"
      Answer only: yes or no
    model: "gemma3n:e4b"

  meme_or_funny:
    prompt: |
      Does this email subject suggest the sender is sharing something funny,
      a meme, a joke, or humorous content? Look for words like "lol", "haha",
      "funny", "meme", "look at this", or similar casual language.
      Subject: "{subject}"
      Answer only: yes or no
    model: "gemma3n:e4b"

chains:
  main:
    # Self-to-self emails get special handling
    - match:
        from: "devon.jones@gmail.com"
        to: "devon.jones@gmail.com"
      jump: self_note

    # Aurelia's emails - daughter sending memes/links
    - match:
        from: "aurelia.ada.jones@gmail.com"
      jump: aurelia

    # Nextdoor - social/neighborhood
    - match:
        from: "reply@ss.email.nextdoor.com"
      action:
        label: "Automated/Social/Nextdoor"
        archive: true

    # Mailing lists with sublabels
    - match:
        from: "mythtv-users@mythtv.org"
      action:
        label: "MailingList/MythTV"
        archive: true

    # Commercial/Retail - archive
    - match:
        from:
          - "chicos@c.chicos.com"
          - "newsletter@em.teepublic.com"
          - "noreply@handandstone.com"
          - "info@mail.levi.com"
      action:
        label: "Commercial/Retail"
        archive: true

    # Fallback: no action for now (will add more rules later)
    - match: {}
      action:
        label: "Uncategorized"

  self_note:
    # Archive workflow - uses LLM intent matching
    - match:
        subject_intent: "archive_request"
      action:
        label: "Archiver"

    # Todo items - uses LLM intent matching
    - match:
        subject_intent: "todo_request"
      action:
        label: "Todo"

    # Unmatched self-notes
    - match: {}
      action:
        label: "Self-Note"

  aurelia:
    # Memes or link dumps (likely Pinterest shares)
    - match:
        any_of:
          - subject_intent: "meme_or_funny"
          - body_is_mostly_links: true
      action:
        label: "Aurelia/Memes"

    # Regular emails from Aurelia
    - match: {}
      action:
        label: "Aurelia"
